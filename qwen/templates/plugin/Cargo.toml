[package]
name = "psb-VARIANT"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
# cdylib only. Unit tests still run natively with `cargo test --lib --target <host>`; adding "rlib"
# makes a plain native `cargo test` try to link the cdylib, which fails on the API's wasm exports.
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { workspace = true }
tracing = "0.1"
